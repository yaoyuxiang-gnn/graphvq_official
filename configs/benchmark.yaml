data:
  datasets: [MUTAG, ENZYMES, PROTEINS, NCI1]

model:
  hidden: 64
  num_layers: 2
  codebook_size: 32

training:
  epochs: 100
  batch_size: 64
  eval_batch_size: 256
  lr: 0.001
  commitment_beta: 0.25
  seeds: [0, 1, 2]
  train_ratio: 0.8
  val_ratio: 0.1

scaling:
  codebook_sizes: [8, 16, 32, 64, 128, 256, 512]  # E7: denser grid + utilization
  dataset: PROTEINS
