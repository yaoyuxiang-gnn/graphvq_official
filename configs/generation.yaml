datasets: [MUTAG, PROTEINS, QM9]
window: 8
hidden: 32
codebook_size: 32
lr: 0.001
commitment_beta: 0.25
sparsity_beta: 0.0
edge_head: bce          # bce (v2, Bernoulli) | mse (v1, 0.5 threshold)
prior_type: gru         # gru | transformer (reviewer Q1 ablation)
prior_hidden: 32        # prior width; 128 for the transformer-128 variant
order: bfs              # bfs | dfs | deg_desc | random (reviewer Q3 ablation)
stage1_epochs: 80
stage2_epochs: 80
seed: 0
seeds: [0, 1, 2]        # E13: multi-seed evaluation
num_samples: 300
max_nodes: 128
temperature: 1.0
n_qm9: 5000
